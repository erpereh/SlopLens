<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tweet fixture</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #000;
        color: #e7e9ea;
      }
      #timeline {
        max-width: 600px;
        margin: 0 auto;
        padding: 24px 16px 80px;
      }
      article[data-testid="tweet"] {
        border: 1px solid #2f3336;
        border-radius: 16px;
        padding: 12px 16px;
        margin-bottom: 12px;
      }
      [data-testid="User-Name"] {
        font-weight: 700;
      }
      [data-testid="tweetText"] {
        margin: 8px 0 12px;
        line-height: 1.4;
      }
      time a {
        color: #71767b;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main id="timeline">
      <article data-testid="tweet" id="tweet-1">
        <div data-testid="User-Name">Jane Doe</div>
        <div data-testid="tweetText">Hello from SlopLens</div>
        <time datetime="2026-01-15T12:00:00.000Z">
          <a href="https://x.com/jane/status/1234567890">Jan 15</a>
        </time>
      </article>
    </main>
    <script>
      window.__sloplensFixtures = {
        addTweet() {
          const article = document.createElement("article");
          article.setAttribute("data-testid", "tweet");
          article.id = "tweet-2";
          article.innerHTML = `
            <div data-testid="User-Name">Alex Roe</div>
            <div data-testid="tweetText">A second post on the timeline</div>
            <time datetime="2026-02-01T08:00:00.000Z">
              <a href="https://x.com/alex/status/9876543210">Feb 1</a>
            </time>
          `;
          document.getElementById("timeline").appendChild(article);
        },
        changeHash() {
          location.hash = "#status-later";
        },
      };
    </script>
  </body>
</html>
